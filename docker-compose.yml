version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: liquidation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: ["python", "main_runner.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SYMBOL=${SYMBOL:-BTCUSDT}
      - DEPTH_LIMIT=${DEPTH_LIMIT:-200}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://postgres:postgres@postgres:5432/liquidation}
      - PUBLISH_BATCH_SIZE=${PUBLISH_BATCH_SIZE:-50}
      - PUBLISH_BATCH_INTERVAL=${PUBLISH_BATCH_INTERVAL:-1.0}

      - HYPERLIQUID_BASE_URL=${HYPERLIQUID_BASE_URL:-https://api.hyperliquid.xyz}
      - HYPERLIQUID_FUNDING_PATH=${HYPERLIQUID_FUNDING_PATH:-/info}
      - HYPERLIQUID_OI_PATH=${HYPERLIQUID_OI_PATH:-/info}
      - HYPERLIQUID_POLL_INTERVAL=${HYPERLIQUID_POLL_INTERVAL:-5}
      - HYPERLIQUID_TIMEOUT=${HYPERLIQUID_TIMEOUT:-5}
      - HYPERLIQUID_RETRIES=${HYPERLIQUID_RETRIES:-3}
      - HYPERLIQUID_SYMBOLS=${HYPERLIQUID_SYMBOLS:-BTC,ETH,SOL}
      - HYPERLIQUID_API_KEY=${HYPERLIQUID_API_KEY:-}
      - HYPERLIQUID_API_SECRET=${HYPERLIQUID_API_SECRET:-}

      - METRICS_PORT=${METRICS_PORT:-8000}
    ports:
      - "${METRICS_PORT:-8000}:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

volumes:
  pgdata:
